[package]
name = "kvsrv"
version = "0.1.0"
edition = "2021"

[dependencies]
futures = "0.3"
serde = { version = "1", features = ["derive"] }
tarpc = { version = "0.38", features = ["serde-transport-json", "tcp"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
