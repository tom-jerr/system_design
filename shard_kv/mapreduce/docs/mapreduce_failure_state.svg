<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040">
<rect width="1600" height="1040" fill="#f8fafc"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#607588"/></marker></defs>
<text x="70" y="66" font-family="Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="30" font-weight="700" fill="#172b3a" text-anchor="start">MapReduce：节点本地中间结果的失效与重拉</text>
<text x="70" y="101" font-family="Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="16" font-weight="400" fill="#526778" text-anchor="start">worker 进程模拟节点；manifest 指向 owner 的数据 socket；节点失效后 map 重算，reduce attempt 重启</text>
<rect x="48" y="145" width="1504" height="155" rx="20" fill="#ffffff" stroke="#d8e1e8" stroke-width="1.3"/>
<text x="78" y="176" font-family="Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="13" font-weight="700" fill="#526778" text-anchor="start">NODE / DATA OWNER</text>
<rect x="48" y="335" width="1504" height="260" rx="20" fill="#ffffff" stroke="#d8e1e8" stroke-width="1.3"/>
<text x="78" y="366" font-family="Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="13" font-weight="700" fill="#526778" text-anchor="start">MAP TASK + MANIFEST</text>
<rect x="48" y="630" width="1504" height="330" rx="20" fill="#ffffff" stroke="#d8e1e8" stroke-width="1.3"/>
<text x="78" y="661" font-family="Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="13" font-weight="700" fill="#526778" text-anchor="start">REDUCE TASK ATTEMPT</text>
<rect x="270" y="205" width="250" height="78" rx="14" fill="#dcecff" stroke="#3476b8" stroke-width="2.2"/>
<text x="395.0" y="236" font-family="Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="18" font-weight="700" fill="#172b3a" text-anchor="middle">ALIVE</text>
<text x="395.0" y="261" font-family="Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="14" font-weight="400" fill="#526778" text-anchor="middle"><tspan x="395.0" dy="0">heartbeats renew the lease</tspan><tspan x="395.0" dy="19">data socket serves local files</tspan></text>
<rect x="850" y="205" width="250" height="78" rx="14" fill="#fde4e2" stroke="#bd4b43" stroke-width="2.2"/>
<text x="975.0" y="236" font-family="Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="18" font-weight="700" fill="#bd4b43" text-anchor="middle">DOWN</text>
<text x="975.0" y="261" font-family="Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="14" font-weight="400" fill="#526778" text-anchor="middle"><tspan x="975.0" dy="0">lease expires or data fetch fails</tspan><tspan x="975.0" dy="19">local disk is unreachable</tspan></text>
<path d="M 520 244 H 850" fill="none" stroke="#bd4b43" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="612.5" y="210" width="145" height="28" rx="8" fill="#f8fafc"/>
<text x="685" y="229" font-family="Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="13" font-weight="600" fill="#bd4b43" text-anchor="middle">failure detector</text>
<text x="1190" y="242" font-family="Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="15" font-weight="500" fill="#526778" text-anchor="start">A new process gets a new worker/node ID</text>
<rect x="120" y="430" width="205" height="92" rx="14" fill="#eef3f7" stroke="#8293a1" stroke-width="2.2"/>
<text x="222.5" y="461" font-family="Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="18" font-weight="700" fill="#172b3a" text-anchor="middle">PENDING</text>
<text x="222.5" y="486" font-family="Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="14" font-weight="400" fill="#526778" text-anchor="middle"><tspan x="222.5" dy="0">queued for a worker</tspan></text>
<rect x="405" y="430" width="215" height="92" rx="14" fill="#dcecff" stroke="#3476b8" stroke-width="2.2"/>
<text x="512.5" y="461" font-family="Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="18" font-weight="700" fill="#172b3a" text-anchor="middle">RUNNING</text>
<text x="512.5" y="486" font-family="Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="14" font-weight="400" fill="#526778" text-anchor="middle"><tspan x="512.5" dy="0">owner + attempt + lease</tspan></text>
<rect x="735" y="415" width="300" height="122" rx="14" fill="#dff3e8" stroke="#31845d" stroke-width="2.2"/>
<text x="885.0" y="446" font-family="Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="18" font-weight="700" fill="#31845d" text-anchor="middle">COMMITTED MANIFEST</text>
<text x="885.0" y="471" font-family="Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="14" font-weight="400" fill="#526778" text-anchor="middle"><tspan x="885.0" dy="0">owner node + version</tspan><tspan x="885.0" dy="19">R local partition files</tspan><tspan x="885.0" dy="19">visible only after CompleteMap</tspan></text>
<rect x="1190" y="430" width="220" height="92" rx="14" fill="#fde4e2" stroke="#bd4b43" stroke-width="2.2"/>
<text x="1300.0" y="461" font-family="Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="18" font-weight="700" fill="#bd4b43" text-anchor="middle">INVALIDATED</text>
<text x="1300.0" y="486" font-family="Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="14" font-weight="400" fill="#526778" text-anchor="middle"><tspan x="1300.0" dy="0">owner&#x27;s files unavailable</tspan></text>
<path d="M 325 476 H 405" fill="none" stroke="#3476b8" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="327.0" y="437" width="76" height="28" rx="8" fill="#f8fafc"/>
<text x="365" y="456" font-family="Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="13" font-weight="600" fill="#3476b8" text-anchor="middle">assign</text>
<path d="M 620 476 H 735" fill="none" stroke="#31845d" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="596.0" y="430" width="164" height="28" rx="8" fill="#f8fafc"/>
<text x="678" y="449" font-family="Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="13" font-weight="600" fill="#31845d" text-anchor="middle">R files + valid attempt</text>
<path d="M 1035 480 H 1190" fill="none" stroke="#bd4b43" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="1056.0" y="439" width="112" height="28" rx="8" fill="#f8fafc"/>
<text x="1112" y="458" font-family="Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="13" font-weight="600" fill="#bd4b43" text-anchor="middle">node down</text>
<path d="M 510 522 V 574 H 220 V 522" fill="none" stroke="#b27a12" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="227.5" y="548" width="275" height="28" rx="8" fill="#f8fafc"/>
<text x="365" y="567" font-family="Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="13" font-weight="600" fill="#b27a12" text-anchor="middle">worker/lease failure: retry same map task</text>
<path d="M 1300 522 V 576 H 300 V 522" fill="none" stroke="#bd4b43" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="660.0" y="549" width="270" height="28" rx="8" fill="#f8fafc"/>
<text x="795" y="568" font-family="Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="13" font-weight="600" fill="#bd4b43" text-anchor="middle">clear location; queue map for recompute</text>
<path d="M 975 283 V 370 H 1320 V 430" fill="none" stroke="#bd4b43" stroke-width="2.4" marker-end="url(#arrow)" stroke-dasharray="8 7"/>
<rect x="992.5" y="338" width="315" height="28" rx="8" fill="#f8fafc"/>
<text x="1150" y="357" font-family="Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="13" font-weight="600" fill="#bd4b43" text-anchor="middle">owner node&#x27;s entire manifest becomes unavailable</text>
<rect x="90" y="750" width="205" height="86" rx="14" fill="#eef3f7" stroke="#8293a1" stroke-width="2.2"/>
<text x="192.5" y="781" font-family="Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="18" font-weight="700" fill="#172b3a" text-anchor="middle">PENDING</text>
<text x="192.5" y="806" font-family="Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="14" font-weight="400" fill="#526778" text-anchor="middle"><tspan x="192.5" dy="0">new attempt</tspan></text>
<rect x="355" y="750" width="235" height="86" rx="14" fill="#dcecff" stroke="#3476b8" stroke-width="2.2"/>
<text x="472.5" y="781" font-family="Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="18" font-weight="700" fill="#172b3a" text-anchor="middle">PULLING</text>
<text x="472.5" y="806" font-family="Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="14" font-weight="400" fill="#526778" text-anchor="middle"><tspan x="472.5" dy="0">fetch each map partition</tspan><tspan x="472.5" dy="19">track map ID + version</tspan></text>
<rect x="680" y="750" width="215" height="86" rx="14" fill="#fff1cf" stroke="#b27a12" stroke-width="2.2"/>
<text x="787.5" y="781" font-family="Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="18" font-weight="700" fill="#172b3a" text-anchor="middle">REDUCING</text>
<text x="787.5" y="806" font-family="Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="14" font-weight="400" fill="#526778" text-anchor="middle"><tspan x="787.5" dy="0">all maps ready</tspan><tspan x="787.5" dy="19">sort, group, reduce</tspan></text>
<rect x="1005" y="750" width="215" height="86" rx="14" fill="#dff3e8" stroke="#31845d" stroke-width="2.2"/>
<text x="1112.5" y="781" font-family="Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="18" font-weight="700" fill="#31845d" text-anchor="middle">COMMITTED</text>
<text x="1112.5" y="806" font-family="Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="14" font-weight="400" fill="#526778" text-anchor="middle"><tspan x="1112.5" dy="0">master publishes mr-out-R</tspan></text>
<rect x="1320" y="750" width="190" height="86" rx="14" fill="#fde4e2" stroke="#bd4b43" stroke-width="2.2"/>
<text x="1415.0" y="781" font-family="Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="18" font-weight="700" fill="#bd4b43" text-anchor="middle">REVOKED</text>
<text x="1415.0" y="806" font-family="Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="14" font-weight="400" fill="#526778" text-anchor="middle"><tspan x="1415.0" dy="0">stale attempt cannot commit</tspan></text>
<path d="M 295 793 H 355" fill="none" stroke="#3476b8" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="272.5" y="756" width="105" height="28" rx="8" fill="#f8fafc"/>
<text x="325" y="775" font-family="Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="13" font-weight="600" fill="#3476b8" text-anchor="middle">assign reducer</text>
<path d="M 590 793 H 680" fill="none" stroke="#31845d" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="545.0" y="756" width="180" height="28" rx="8" fill="#f8fafc"/>
<text x="635" y="775" font-family="Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="13" font-weight="600" fill="#31845d" text-anchor="middle">all map outputs received</text>
<path d="M 895 793 H 1005" fill="none" stroke="#31845d" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="872.5" y="756" width="155" height="28" rx="8" fill="#f8fafc"/>
<text x="950" y="775" font-family="Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="13" font-weight="600" fill="#31845d" text-anchor="middle">fetch + atomic publish</text>
<path d="M 472 836 V 900 H 1415 V 836" fill="none" stroke="#bd4b43" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="820.0" y="875" width="220" height="28" rx="8" fill="#f8fafc"/>
<text x="930" y="894" font-family="Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="13" font-weight="600" fill="#bd4b43" text-anchor="middle">source manifest lost while pulling</text>
<path d="M 1110 836 V 933 H 1415 V 836" fill="none" stroke="#bd4b43" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="1105.0" y="908" width="310" height="28" rx="8" fill="#f8fafc"/>
<text x="1260" y="927" font-family="Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="13" font-weight="600" fill="#bd4b43" text-anchor="middle">source node lost during reduce; completion rejected</text>
<path d="M 1320 792 H 295" fill="none" stroke="#3476b8" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="625.0" y="702" width="360" height="28" rx="8" fill="#f8fafc"/>
<text x="805" y="721" font-family="Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="13" font-weight="600" fill="#3476b8" text-anchor="middle">master reassigns; new attempt pulls current manifests</text>
<path d="M 885 537 V 660 H 472 V 750" fill="none" stroke="#3476b8" stroke-width="2.4" marker-end="url(#arrow)" stroke-dasharray="8 7"/>
<rect x="525.0" y="631" width="330" height="28" rx="8" fill="#f8fafc"/>
<text x="690" y="650" font-family="Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="13" font-weight="600" fill="#3476b8" text-anchor="middle">publish manifest; reducer pulls before all maps finish</text>
<path d="M 1400 522 V 615 H 1415 V 750" fill="none" stroke="#bd4b43" stroke-width="2.4" marker-end="url(#arrow)" stroke-dasharray="8 7"/>
<rect x="1230.0" y="594" width="190" height="28" rx="8" fill="#f8fafc"/>
<text x="1325" y="613" font-family="Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="13" font-weight="600" fill="#bd4b43" text-anchor="middle">revoke in-flight reducers</text>
<text x="72" y="1000" font-family="Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="15" font-weight="400" fill="#526778" text-anchor="start">重算策略：不复制 map 中间结果；失去 owner 节点后重跑对应 map task。旧 attempt 文件不再出现在 manifest 中。</text>
</svg>
